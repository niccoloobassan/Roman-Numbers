# Pipeline CI/CD per il progetto Roman Number
# Esegue compilazione, test, checkstyle e coverage ad ogni push e pull request
name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout del codice sorgente
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup JDK 11 con distribuzione Temurin
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compilazione del progetto
      - name: Compile
        run: mvn compile

      # Step 4: Esecuzione dei test unitari
      - name: Test
        run: mvn test

      # Step 5: Checkstyle - verifica stile del codice
      # Il plugin checkstyle e' configurato nella fase package
      - name: Checkstyle
        run: mvn checkstyle:check

      # Step 6: Generazione report di coverage con JaCoCo
      - name: Coverage report
        run: mvn jacoco:report

      # Step 7: Pubblicazione coverage su Coveralls
      - name: Coveralls
        run: >
          mvn coveralls:report
          -DrepoToken=${{ secrets.COVERALLS_REPO_TOKEN }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
